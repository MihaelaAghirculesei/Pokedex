name = "pokedex-aghirculesei"
pages_build_output_dir = "dist"
compatibility_date = "2025-05-16"

[vars]
ENVIRONMENT = "production"

# Vite appends content hash to asset filenames — safe to cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/imgs/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Short TTL so PWA manifest changes propagate within an hour
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# SPA catch-all: unmatched paths serve index.html without a redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[env.preview]
  [env.preview.vars]
    ENVIRONMENT = "preview"
