<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive Pokédex - Explore all Pokemon with advanced search, detailed stats, and offline support">
    <meta name="author" content="Mihaela Melania Aghirculesei">
    <meta property="og:title" content="Pokédex - Interactive Pokemon Encyclopedia">
    <meta property="og:description" content="Interactive Pokédex - Explore all Pokemon with advanced search, detailed stats, and offline support">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/imgs/icons/pokemon-ball.png">
    <meta property="og:url" content="https://pokedex-aghirculesei.pages.dev/">
    <meta name="theme-color" content="#e94560">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pokédex">
    <link rel="icon" type="image/png" href="/imgs/icons/pokemon-ball.png">
    <link rel="apple-touch-icon" href="/imgs/icons/pokemon-ball.png">
    <link rel="manifest" href="/manifest.json">
    <title>Pokédex</title>

    <link rel="preconnect" href="https://pokeapi.co">
    <link rel="preconnect" href="https://raw.githubusercontent.com">

    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="style.css">
    <script src="/src/main.ts" type="module"></script>
</head>
<body>
    <noscript><style>body{padding:2rem;font-family:Arial,sans-serif;color:#fff;text-align:center}</style><p>This Pokédex requires JavaScript. Please enable it in your browser.</p></noscript>
    <header class="header">
        <div class="header-content">
            <a class="logo" href="#" aria-label="Home">
                <div class="headline-box">
                    <img class="headline-icon"
                         src="/imgs/icons/pokemon-ball.png"
                         alt="Pokéball Icon"
                         aria-hidden="true">
                    <h1 class="headline">Pokédex</h1>
                </div>
            </a>
            <button id="languageToggle" type="button" class="language-toggle en" aria-label="Switch language">
                <span class="lang-label">DE</span>
                <div class="slider"></div>
                <span class="lang-label active">EN</span>
            </button>
            <input class="search-input"
                   id="search-input"
                   type="text"
                   placeholder="Search"
                   aria-label="Search Pokémon"
                   autocomplete="off">
        </div>
    </header>

    <main class="pokemon-content">
        <div id="loading" class="loading-indicator" role="status">Loading...</div>
        <div role="status" aria-live="polite" aria-atomic="true" id="search-status" class="sr-only"></div>
        <div id="pokedex-container" class="pokedex-container" aria-live="polite">
        </div>
        <button id="load-more" class="load-more-btn">
            <span>⚡ Load More Pokémon</span>
        </button>
    </main>

    <footer class="footer">
        <a class="logo" href="#" aria-label="Back to top">
            <div class="headline-box">
                <img class="headline-icon"
                     src="/imgs/icons/icon-pokemon.png"
                     alt="Pokémon Logo"
                     aria-hidden="true">
                <h2 class="headline">Pokédex</h2>
            </div>
        </a>
        <a href="impressum.html" class="button">Legal Notice</a>
    </footer>
</body>
</html>
