<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive Pokédex - Explore all Pokemon with advanced search, detailed stats, and offline support"
    />
    <meta name="author" content="Mihaela Melania Aghirculesei" />
    <meta property="og:title" content="Pokédex - Interactive Pokemon Encyclopedia" />
    <meta
      property="og:description"
      content="Interactive Pokédex - Explore all Pokemon with advanced search, detailed stats, and offline support"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://pokedex-aghirculesei.pages.dev/imgs/og-image.png" />
    <meta property="og:url" content="https://pokedex-aghirculesei.pages.dev/" />
    <meta name="theme-color" content="#e94560" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pokédex" />
    <link rel="icon" type="image/png" href="/imgs/icons/pokemon-ball.png" />
    <link rel="apple-touch-icon" href="/imgs/icons/pokemon-ball.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Pokédex</title>

    <link rel="canonical" href="https://pokedex-aghirculesei.pages.dev/" />
    <link rel="preconnect" href="https://pokeapi.co" />
    <link rel="dns-prefetch" href="https://pokeapi.co" />
    <link rel="preconnect" href="https://wsrv.nl" crossorigin />
    <link rel="dns-prefetch" href="https://wsrv.nl" />
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
    <link rel="dns-prefetch" href="https://raw.githubusercontent.com" />

    <style>
      :root {
        --primary-color: #0a5485;
        --secondary-color: aqua;
        --font-family: Arial, sans-serif;
        --card-width: 250px;
        --card-height: 350px;
        --border-radius: 20px;
        --type-color: aqua;
        --padding: 20px;
        --transition-duration: 0.3s;
        --hover-shadow:
          0 0 30px -5px white, 0 0 10px -7px white, 0 55px 35px -20px rgba(0, 0, 0, 0.5);
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        width: 100%;
        font-family: var(--font-family);
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url(/imgs/background/Designer.webp);
        background-size: cover;
        background-position: center;
        z-index: -1;
      }
      main {
        flex: 1;
        width: 100%;
        min-height: 100vh;
      }
      .header,
      header {
        background-color: var(--primary-color);
        border: 2px solid var(--secondary-color);
        border-radius: var(--border-radius);
        padding: var(--padding);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .header-content {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        max-width: 1440px;
        margin: 0 auto;
      }
      .headline-box {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: row;
        gap: 15px;
        width: 100%;
      }
      @keyframes spinLogo {
        0% {
          transform: rotate(0deg) scale(0.5);
          opacity: 0;
        }
        50% {
          transform: rotate(360deg) scale(1.1);
          opacity: 0.7;
        }
        100% {
          transform: rotate(720deg) scale(1);
          opacity: 1;
        }
      }
      .headline-icon {
        width: 80px;
        flex-shrink: 0;
        transition: all 0.3s ease;
        filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.5));
      }
      .header .headline-icon {
        animation: spinLogo 2s ease-in-out;
      }
      .headline {
        color: #fff;
      }
      .search-input {
        padding: 5px 10px;
        border-radius: var(--border-radius);
        border: 3px solid #000;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .loading-indicator {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 20px;
        background-color: rgba(255, 255, 255, 0.8);
        border-radius: 10px;
        font-size: 20px;
        z-index: 1000;
      }
      .pokemon-content {
        max-width: 1440px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
    </style>

    <script src="/src/main.ts" type="module"></script>
  </head>
  <body>
    <noscript
      ><style>
        body {
          padding: 2rem;
          font-family: Arial, sans-serif;
          color: #fff;
          text-align: center;
        }
      </style>
      <p>This Pokédex requires JavaScript. Please enable it in your browser.</p></noscript
    >
    <header class="header">
      <div class="header-content">
        <a class="logo" href="/" aria-label="Pokédex – home">
          <div class="headline-box">
            <img
              class="headline-icon"
              src="/imgs/icons/pokemon-ball.webp"
              alt="Pokéball Icon"
              aria-hidden="true"
              width="80"
              height="80"
              fetchpriority="high"
              decoding="async"
            />
            <h1 class="headline">Pokédex</h1>
          </div>
        </a>
        <div class="header-controls">
          <input
            class="search-input"
            id="search-input"
            type="text"
            placeholder="Search (min. 3 chars)"
            aria-label="Search Pokémon"
            autocomplete="off"
          />
          <details class="keyboard-hint">
            <summary aria-label="Keyboard shortcuts">⌨</summary>
            <div class="keyboard-hint-panel" role="tooltip">
              <p class="keyboard-hint-section">Grid</p>
              <p><kbd>←</kbd> <kbd>→</kbd> navigate cards</p>
              <p class="keyboard-hint-section">Detail view</p>
              <p><kbd>←</kbd> <kbd>→</kbd> Pokémon</p>
              <p><kbd>↑</kbd> <kbd>↓</kbd> switch tabs</p>
              <p><kbd>Esc</kbd> close</p>
              <p><kbd>Tab</kbd> cycle focus</p>
            </div>
          </details>
        </div>
      </div>
    </header>

    <main class="pokemon-content">
      <div id="loading" class="loading-indicator" role="status" hidden>Loading...</div>
      <div
        role="status"
        aria-live="polite"
        aria-atomic="true"
        id="search-status"
        class="sr-only"
      ></div>
      <div id="search-no-results" class="search-no-results" hidden></div>
      <h2 class="sr-only">Pokémon list</h2>
      <div id="pokedex-container" class="pokedex-container"></div>
      <button id="load-more" class="load-more-btn">
        <span>⚡ Load More Pokémon</span>
      </button>
    </main>

    <script>
      (function () {
        var c = document.getElementById('pokedex-container');
        if (!c) return;
        var inner =
          '<div class="pokemon-card-header">' +
          '<div class="skeleton-block" style="width:55%;height:18px"></div>' +
          '<div class="skeleton-block" style="width:20%;height:18px"></div>' +
          '</div>' +
          '<div class="pokemon-image-container">' +
          '<div class="skeleton-block" style="width:180px;height:180px;border-radius:50%"></div>' +
          '</div>' +
          '<div class="pokemon-card-footer">' +
          '<div class="skeleton-block" style="width:70px;height:28px;border-radius:12px"></div>' +
          '</div>';
        var f = document.createDocumentFragment();
        for (var i = 0; i < 30; i++) {
          var d = document.createElement('div');
          d.className = 'skeleton-card';
          d.innerHTML = inner;
          f.appendChild(d);
        }
        c.appendChild(f);
      })();
    </script>

    <footer class="footer">
      <a class="logo" href="#top" aria-label="Pokédex – back to top">
        <div class="headline-box">
          <img
            class="headline-icon"
            src="/imgs/icons/icon-pokemon.webp"
            alt="Pokémon Logo"
            aria-hidden="true"
            width="80"
            height="80"
            loading="lazy"
            decoding="async"
          />
          <h2 class="headline">Pokédex</h2>
        </div>
      </a>
      <a href="impressum.html" class="button">Legal Notice</a>
    </footer>
  </body>
</html>
