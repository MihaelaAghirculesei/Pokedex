<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found — Pokédex">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/imgs/icons/pokemon-ball.png">
  <title>404 – Not Found | Pokédex</title>
  <style>
    /* ── Design tokens ─────────────────────────────────────────── */
    :root {
      --primary:  #0a5485;
      --accent:   aqua;
      --radius:   20px;
      --font:     Arial, sans-serif;
      --padding:  20px;
    }

    /* ── Reset ─────────────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Body / background ─────────────────────────────────────── */
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      font-family: var(--font);
      color: #fff;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('/imgs/background/Designer.webp');
      background-size: cover;
      background-position: center;
      z-index: -1;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    header {
      background-color: var(--primary);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      padding: var(--padding);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }
    .logo { text-decoration: none; }
    .headline-box {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .headline { color: #fff; }
    .headline-icon {
      width: 80px;
      filter: drop-shadow(0 0 10px rgba(0,255,255,.5));
      transition: all .3s ease;
    }
    .headline-icon:hover {
      transform: rotate(360deg) scale(1.1);
      filter: drop-shadow(0 0 20px rgba(0,255,255,.8));
      animation: bounce .6s ease-in-out;
    }

    /* ── Animations ─────────────────────────────────────────────── */
    @keyframes spinLogo {
      0%   { transform: rotate(0deg)   scale(.5);  opacity: 0; }
      50%  { transform: rotate(360deg) scale(1.1); opacity: .7; }
      100% { transform: rotate(720deg) scale(1);   opacity: 1; }
    }
    @keyframes bounce {
      0%,100% { transform: rotate(0deg)   scale(1.1); }
      25%      { transform: rotate(90deg)  scale(1.2); }
      50%      { transform: rotate(180deg) scale(1.15); }
      75%      { transform: rotate(270deg) scale(1.2); }
    }
    @keyframes float {
      0%,100% { transform: translateY(0)    rotate(0deg); }
      33%      { transform: translateY(-14px) rotate(12deg); }
      66%      { transform: translateY(-7px)  rotate(-9deg); }
    }

    header .headline-icon { animation: spinLogo 2s ease-in-out; }

    /* ── Main / 404 block ───────────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .not-found {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 3rem 1.5rem;
      max-width: 480px;
    }
    .not-found-img {
      width: 120px;
      height: 120px;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 0 24px rgba(0,255,255,.5));
      animation: float 3.5s ease-in-out infinite;
    }
    .not-found-code {
      font-size: clamp(4rem, 18vw, 7rem);
      font-weight: bold;
      color: var(--accent);
      line-height: 1;
      text-shadow: 0 0 40px rgba(0,255,255,.6);
    }
    .not-found-title {
      font-size: clamp(1rem, 3.5vw, 1.5rem);
      margin: .5rem 0 1rem;
    }
    .not-found-path {
      font-size: .85rem;
      color: rgba(255,255,255,.5);
      font-family: monospace;
      margin-bottom: 1.5rem;
      min-height: 1.2em;
      word-break: break-all;
    }
    .not-found-text {
      font-size: 1rem;
      opacity: .8;
      margin-bottom: 2rem;
    }

    /* ── Button ─────────────────────────────────────────────────── */
    .button {
      display: inline-block;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      background: linear-gradient(135deg, var(--accent) 0%, #00e6e6 100%);
      color: #000;
      padding: 12px 28px;
      border-radius: 25px;
      border: 3px solid #000;
      box-shadow: 0 4px 10px rgba(0,255,255,.3);
      transition: all .3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,255,255,.5);
      background: linear-gradient(135deg, #00e6e6 0%, var(--accent) 100%);
    }
    .button:active { transform: translateY(0); box-shadow: 0 2px 5px rgba(0,255,255,.3); }

    /* ── Footer ─────────────────────────────────────────────────── */
    footer {
      background-color: rgb(1,48,9);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      padding: var(--padding);
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 50px;
    }
    footer .headline-icon {
      animation: spinLogo 2s ease-in-out;
      transform: translateY(17px);
    }

    /* ── Reduced motion ─────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    /* ── Mobile ─────────────────────────────────────────────────── */
    @media (max-width: 431px) {
      header   { padding: 10px 12px; }
      .headline-icon { width: 60px; }
      .headline-box .headline { display: none; }
      .button  { font-size: .9rem; padding: 10px 20px; }
      footer {
        justify-content: space-between;
        padding: 12px 20px;
        height: 75px;
        margin-top: 0;
      }
      footer .headline-icon { transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <a class="logo" href="/" aria-label="Home — Pokédex">
        <div class="headline-box">
          <img class="headline-icon"
               src="/imgs/icons/pokemon-ball.png"
               alt=""
               aria-hidden="true">
          <h1 class="headline">Pokédex</h1>
        </div>
      </a>
    </div>
  </header>

  <main>
    <div class="not-found">
      <img class="not-found-img"
           src="/imgs/icons/pokemon-ball.png"
           alt="Lost Pokéball floating in the void">
      <p class="not-found-code" aria-label="Error 404">404</p>
      <h2 class="not-found-title">This Pokémon fled into the tall grass.</h2>
      <p class="not-found-path" id="js-path" aria-live="polite"></p>
      <p class="not-found-text">The page you're looking for doesn't exist or has been moved.</p>
      <a href="/" class="button">Back to Pokédex</a>
    </div>
  </main>

  <footer>
    <a class="logo" href="/" aria-label="Back to Pokédex home">
      <div class="headline-box">
        <img class="headline-icon"
             src="/imgs/icons/icon-pokemon.png"
             alt="Pokémon Logo"
             aria-hidden="true">
        <h2 class="headline">Pokédex</h2>
      </div>
    </a>
    <a href="/impressum.html" class="button">Legal Notice</a>
  </footer>

  <script>
    const el = document.getElementById('js-path');
    const p = location.pathname;
    if (p && p !== '/') el.textContent = p;
  </script>

</body>
</html>
