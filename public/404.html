<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - Pokédex">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="imgs/icons/pokemon-ball.png">
    <title>404 – Page Not Found | Pokédex</title>
    <link rel="stylesheet" href="shared.css">
    <style>
        .not-found-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 3rem 1rem;
            text-align: center;
            color: white;
        }
        .not-found-img {
            width: 120px;
            height: 120px;
            opacity: 0.6;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.4));
        }
        .not-found-code {
            font-size: 5rem;
            font-weight: bold;
            color: var(--secondary-color);
            line-height: 1;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }
        .not-found-title {
            font-size: 1.5rem;
            margin: 0.5rem 0 1rem;
            color: white;
        }
        .not-found-text {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 2rem;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a class="logo" href="index.html" aria-label="Home">
                <div class="headline-box">
                    <img class="headline-icon animate-logo"
                         src="./imgs/icons/pokemon-ball.png"
                         alt="Pokéball Icon"
                         aria-hidden="true">
                    <h1 class="headline">Pokédex</h1>
                </div>
            </a>
        </div>
    </header>

    <main class="pokemon-content">
        <div class="not-found-content">
            <img class="not-found-img"
                 src="./imgs/icons/pokemon-ball.png"
                 alt="Lost Pokéball">
            <p class="not-found-code">404</p>
            <h2 class="not-found-title">This page fled into the tall grass.</h2>
            <p class="not-found-text">The page you are looking for does not exist or has been moved.</p>
            <a href="index.html" class="button">Back to Pokédex</a>
        </div>
    </main>

    <footer class="footer">
        <a class="logo" href="index.html" aria-label="Back to top">
            <div class="headline-box">
                <img class="headline-icon"
                     src="./imgs/icons/icon-pokemon.png"
                     alt="Pokémon Logo"
                     aria-hidden="true">
                <h2 class="headline">Pokédex</h2>
            </div>
        </a>
        <a href="impressum.html" class="button">Legal Notice</a>
    </footer>
</body>
</html>
