version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      size-limit:
        patterns:
          - 'size-limit'
          - '@size-limit/*'
      commitlint:
        patterns:
          - '@commitlint/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'eslint-*'
          - 'typescript-eslint'
      playwright:
        patterns:
          - 'playwright'
          - '@playwright/*'
    ignore:
      # typescript-eslint 8.x peers on typescript <6.1.0, so a TS 7 bump fails
      # `npm ci` with ERESOLVE (PR #71). Remove this entry once a
      # typescript-eslint release widens its peer range to include 7.x (#87).
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
