name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck, Lint, Format, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Build
        run: npm run build

      - name: Bundle size check
        run: npm run size

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # Intentionally Chromium-only: keeps CI fast and avoids installing
        # ~500 MB of extra browser binaries. Firefox and WebKit are supported
        # locally via: ALL_BROWSERS=true npm run test:e2e
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e:functional -- --project=chromium --project=mobile-chrome

      - name: Run visual regression tests
        run: |
          if npm run e2e:visual:ci; then
            exit 0
          fi

          # Tests failed — try regenerating snapshots
          npx playwright test e2e/visual.spec.ts --update-snapshots \
            --project=chromium --project=mobile-chrome

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.ts-snapshots/

          if git diff --cached --quiet; then
            # No new snapshots — failure has another cause, show it
            npm run e2e:visual:ci
            exit 1
          fi

          git commit -m "test(visual): update Linux baselines [skip ci]"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: npm run lighthouse:ci
