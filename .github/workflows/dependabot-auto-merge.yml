name: Dependabot auto-merge

# The merge must NOT be performed with GITHUB_TOKEN: GitHub never starts new
# workflow runs for events created by GITHUB_TOKEN, so a squash-merge done with
# it silently skips CI on main — and with it the production deploy, which is
# chained to CI via `workflow_run` (see deploy.yml).
#
# Instead, each run mints a short-lived installation token for a GitHub App
# installed on this repository only, with "Contents: Read and write" +
# "Pull requests: Read and write". Installation tokens expire after one hour
# and the App's private key does not expire, so there is nothing to rotate.
#
# Required Actions secrets (Settings → Secrets and variables → Actions).
# pull_request_target runs read Actions secrets even when Dependabot triggers
# them (the job log shows "Secret source: Actions"); Dependabot secrets are
# not visible here. This is safe because the workflow never checks out or
# runs code from the pull request.
#   AUTOMERGE_APP_CLIENT_ID   — the App's Client ID
#   AUTOMERGE_APP_PRIVATE_KEY — a private key generated for the App (.pem)

on: pull_request_target

# GITHUB_TOKEN is only used to read PR metadata; the merge uses the App token.
permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    # github.actor is whoever triggered this run, not who opened the PR:
    # Dependabot updating someone else's PR would satisfy an actor-only check.
    if: >
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Check GitHub App secrets
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::AUTOMERGE_APP_CLIENT_ID and AUTOMERGE_APP_PRIVATE_KEY Actions secrets are required. Refusing to fall back to GITHUB_TOKEN: merges made with it skip CI on main."
            exit 1
          fi
        env:
          CLIENT_ID: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      - name: Create GitHub App token
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge for patch/minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
