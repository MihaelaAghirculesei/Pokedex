name: Update visual snapshots

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Playwright project(s) to update'
        required: false
        default: 'chromium mobile-chrome'

jobs:
  update-snapshots:
    name: Regenerate baselines on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Update snapshots
        run: |
          for project in ${{ github.event.inputs.project }}; do
            npx playwright test e2e/visual.spec.ts --update-snapshots --project="$project"
          done

      - name: Commit updated snapshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.ts-snapshots/
          git diff --cached --quiet && echo "No snapshot changes" || \
            git commit -m "test(visual): regenerate baselines [skip ci]"
          git push
